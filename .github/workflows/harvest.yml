name: harvest

# Refresh the node feed and publish it.
#   schedule: every 6h (GitHub cron is UTC and often runs 5-20 min late)
#   manual:   Actions -> harvest -> Run workflow (supports a full analytics run)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "search pages per query (10 results each)"
        default: "3"
      health:
        description: "drop nodes whose published health% is below this"
        default: "30"
      speed:
        description: "drop nodes whose published speed (MB/s) is below this"
        default: "1"
      mode:
        description: "refresh = collect+organise+publish; full = also re-measure churn/formats"
        type: choice
        options: [refresh, full]
        default: refresh

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write      # commit the regenerated docs/ snapshot back to main

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # NOTE: GITHUB_TOKEN (the Actions app token) CANNOT read user gists - it
      # returns 403. A PAT with the `gist` scope is required here.
      # GH_PAT and GIST_TOKEN are interchangeable; the first one set wins.
      - name: Collect feeds
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GIST_TOKEN }}
          PAGES: ${{ inputs.pages || '3' }}
        run: |
          cd tools
          python harvest.py search --pages "$PAGES"
          python harvest.py meta
          python fetch_nodes.py
          python check_feeds.py

      - name: Analytics (full mode only)
        if: ${{ inputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GIST_TOKEN }}
        run: |
          cd tools
          python daily.py
          python churn.py
          python formats.py

      - name: Organise
        env:
          HEALTH: ${{ inputs.health || '30' }}
          SPEED: ${{ inputs.speed || '1' }}
        run: |
          cd tools
          python organize.py --cache --health "$HEALTH" --speed "$SPEED"
          python report.py

      - name: Publish to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "skipping publish: GIST_TOKEN secret is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python tools/publish.py --gist "$GIST_ID" --file data/organised.yaml

      - name: Keep the bundle as a run artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: subscription-${{ github.run_id }}
          path: |
            data/organised.yaml
            data/summary.json
            data/organise_report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Commit regenerated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feeds.md
          if git diff --cached --quiet; then
            echo "docs unchanged"
          else
            git commit -m "docs: refresh feed snapshot ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Job summary
        if: ${{ always() }}
        run: python tools/summary_md.py >> "$GITHUB_STEP_SUMMARY"
